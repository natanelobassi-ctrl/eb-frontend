<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classement - Groupe Scolaire Étoile Brillante</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  color:#1f2937;
}

header{
  background:#0A2A78;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  color:#0A2A78;
  margin-top:0;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

select,input,button{
  padding:11px;
  border-radius:7px;
  border:1px solid #ccc;
  font-size:14px;
}

select,input{
  flex:1;
  min-width:180px;
}

button{
  background:#0A2A78;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

.btn-print{
  background:#C9A227;
  color:#111;
}

.btn-retour{
  background:#555;
}

.info-eleve{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.info-box{
  background:#f5f7fb;
  padding:12px;
  border-radius:8px;
}

.info-box strong{
  display:block;
  color:#0A2A78;
  margin-bottom:4px;
}

.table-wrapper{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #777;
  padding:9px;
  text-align:center;
}

th{
  background:#0A2A78;
  color:white;
}

td:nth-child(2){
  text-align:left;
}

.selected{
  background:#fff5c7!important;
  font-weight:bold;
}

.rang{
  font-weight:bold;
  font-size:17px;
}

.message{
  text-align:center;
  padding:25px;
  color:#777;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
  font-weight:bold;
}

.admis{
  background:#d9f7df;
  color:green;
}

.echoue{
  background:#ffe0e0;
  color:#b00020;
}

@media(max-width:700px){

  th,td{
    font-size:12px;
    padding:6px;
  }
}

@media print{

  body{
    background:white;
  }

  header,
  .recherche,
  .actions{
    display:none!important;
  }

  .container{
    max-width:none;
    margin:0;
    padding:0;
  }

  .card{
    box-shadow:none;
  }

  @page{
    size:A4 portrait;
    margin:10mm;
  }
}
</style>
</head>

<body>

<header>
  <h1>Groupe Scolaire Étoile Brillante</h1>
  <p>Classement des élèves</p>
</header>

<div class="container">

  <div class="card recherche">

    <h2>🏆 Classement</h2>

    <div class="row">

      <select id="classe" onchange="afficherClassement()">
        <option value="">Choisir une classe</option>
        <option value="P1">P1</option>
        <option value="P2">P2</option>
        <option value="P3">P3</option>

        <option value="CP1">CP1</option>
        <option value="CP2">CP2</option>
        <option value="CE1">CE1</option>
        <option value="CE2">CE2</option>
        <option value="CM1">CM1</option>
        <option value="CM2">CM2</option>

        <option value="6e">6e</option>
        <option value="5e">5e</option>
        <option value="4e">4e</option>
        <option value="3e">3e</option>

        <option value="Seconde">Seconde</option>
        <option value="STC">STC</option>
        <option value="Première A">Première A</option>
        <option value="Première D">Première D</option>
        <option value="Terminale A">Terminale A</option>
        <option value="Terminale D">Terminale D</option>
      </select>

      <select id="trimestre" onchange="afficherClassement()">
        <option value="1">1er trimestre</option>
        <option value="2">2e trimestre</option>
        <option value="3">3e trimestre</option>
      </select>

      <button onclick="afficherClassement()">
        Actualiser
      </button>

    </div>

  </div>


  <div class="card" id="eleveSelectionne">

    <div class="message">
      Aucun élève sélectionné.
    </div>

  </div>


  <div class="card">

    <h2 id="titreClassement">
      Classement
    </h2>

    <div id="zoneClassement" class="message">
      Choisissez une classe.
    </div>

    <div class="actions">

      <button
        class="btn-print"
        onclick="window.print()">

        🖨️ Imprimer le classement

      </button>

      <button
        class="btn-retour"
        onclick="window.location.href='eleves.html'">

        ← Retour aux élèves

      </button>

    </div>

  </div>

</div>


<script>

/* =================================
   DONNÉES
================================= */

let eleves =
  JSON.parse(
    localStorage.getItem("EB_ELEVES") || "[]"
  );

let eleveActuel = null;


/* =================================
   LECTURE DES NOTES
================================= */

function lireNotes(eleve,trimestre){

  const key =
    "EB_NOTES_" +
    trimestre +
    "T_" +
    eleve.classe +
    "_" +
    eleve.matricule;

  return JSON.parse(
    localStorage.getItem(key) || "{}"
  );
}


/* =================================
   COEFFICIENTS
================================= */

function coefficient(classe,matiere){

  if(classe==="3e"){
    return matiere==="Mathématiques" ? 4 : 2;
  }

  if(classe==="Terminale A"){

    const c={
      "Philosophie":5,
      "Français":5,
      "Histoire":4,
      "Anglais":4,
      "Mathématiques":3,
      "Espagnol":3,
      "EPS":2
    };

    return c[matiere] || 1;
  }

  if(classe==="Terminale D"){

    const c={
      "Mathématiques":4,
      "SVT":5,
      "Sciences physiques":5,
      "Histoire":3,
      "Français":3,
      "Anglais":3,
      "Histoire-Géographie":3,
      "EPS":2
    };

    return c[matiere] || 1;
  }

  return 1;
}


/* =================================
   MOYENNE D'UNE MATIÈRE
================================= */

function moyenneMatiere(note){

  if(!note) return null;

  const devoir =
    Number(note.devoirClasse ?? note.devoir ?? 0);

  const departemental =
    Number(note.devoirDepartemental ?? 0);

  const composition =
    Number(
      note.moyenneComposition ??
      note.composition ??
      0
    );

  const moyenneClasse =
    (devoir + departemental) / 2;

  return (
    moyenneClasse +
    composition
  ) / 2;
}


/* =================================
   MOYENNE TRIMESTRIELLE
================================= */

function moyenneTrimestre(eleve,trimestre){

  const notes =
    lireNotes(eleve,trimestre);

  let total = 0;
  let totalCoeff = 0;

  Object.keys(notes).forEach(matiere=>{

    const moyenne =
      moyenneMatiere(notes[matiere]);

    if(
      moyenne !== null &&
      !isNaN(moyenne)
    ){

      const coef =
        coefficient(
          eleve.classe,
          matiere
        );

      total += moyenne * coef;

      totalCoeff += coef;
    }

  });

  if(totalCoeff===0) return 0;

  return total / totalCoeff;
}


/* =================================
   MOYENNE ANNUELLE
================================= */

function moyenneAnnuelle(eleve){

  const t1 =
    moyenneTrimestre(eleve,1);

  const t2 =
    moyenneTrimestre(eleve,2);

  const t3 =
    moyenneTrimestre(eleve,3);

  if(
    t1===0 &&
    t2===0 &&
    t3===0
  ){
    return 0;
  }

  return (t1+t2+t3)/3;
}


/* =================================
   MENTION
================================= */

function mention(note){

  if(note<4) return "Nul";
  if(note<6) return "Très faible";
  if(note<8) return "Faible";
  if(note<10) return "Insuffisant";
  if(note<12) return "Passable";
  if(note<14) return "Assez bien";
  if(note<16) return "Bien";
  if(note<18) return "Très bien";

  return "Excellent";
}


/* =================================
   AFFICHER ÉLÈVE SÉLECTIONNÉ
================================= */

function afficherEleveSelectionne(){

  const zone =
    document.getElementById(
      "eleveSelectionne"
    );

  if(!eleveActuel){

    zone.innerHTML = `
      <div class="message">
        Aucun élève sélectionné.
      </div>
    `;

    return;
  }

  const moyenne =
    moyenneTrimestre(
      eleveActuel,
      Number(
        document.getElementById("trimestre").value
      )
    );

  zone.innerHTML = `

    <div class="info-eleve">

      <div class="info-box">
        <strong>Élève</strong>
        ${eleveActuel.nom || ""}
        ${eleveActuel.prenom || ""}
      </div>

      <div class="info-box">
        <strong>Matricule</strong>
        ${eleveActuel.matricule || "-"}
      </div>

      <div class="info-box">
        <strong>Classe</strong>
        ${eleveActuel.classe || "-"}
      </div>

      <div class="info-box">
        <strong>Moyenne</strong>
        ${moyenne.toFixed(2)}/20
      </div>

    </div>
  `;
}


/* =================================
   CLASSEMENT
================================= */

function afficherClassement(){

  const classe =
    document.getElementById("classe").value;

  const trimestre =
    Number(
      document.getElementById("trimestre").value
    );

  const zone =
    document.getElementById(
      "zoneClassement"
    );

  if(!classe){

    zone.innerHTML = `
      <div class="message">
        Choisissez une classe.
      </div>
    `;

    return;
  }

  let liste =
    eleves
      .filter(e=>e.classe===classe)
      .map(e=>({

        eleve:e,

        moyenne:
          moyenneTrimestre(
            e,
            trimestre
          )

      }))
      .filter(x=>x.moyenne>0)
      .sort(
        (a,b)=>
          b.moyenne-a.moyenne
      );


  if(!liste.length){

    zone.innerHTML = `
      <div class="message">
        Aucune note enregistrée pour cette classe.
      </div>
    `;

    return;
  }


  let lignes = "";

  liste.forEach((item,index)=>{

    const e =
      item.eleve;

    const rang =
      index+1;

    const selection =
      eleveActuel &&
      e.matricule ===
      eleveActuel.matricule
      ? "selected"
      : "";

    const decision =
      item.moyenne >= 10
      ? "ADMIS"
      : "AJOURNÉ";

    const badge =
      item.moyenne >= 10
      ? "admis"
      : "echoue";


    lignes += `

      <tr
        class="${selection}"
        onclick='selectionnerEleve(${JSON.stringify(e).replace(/'/g,"&#39;")})'
        style="cursor:pointer"
      >

        <td class="rang">
          ${rang}
        </td>

        <td>
          ${e.nom || ""}
          ${e.prenom || ""}
        </td>

        <td>
          ${e.matricule || "-"}
        </td>

        <td>
          ${item.moyenne.toFixed(2)}
        </td>

        <td>
          ${mention(item.moyenne)}
        </td>

        <td>
          <span class="badge ${badge}">
            ${decision}
          </span>
        </td>

      </tr>

    `;
  });


  const nomTrimestre =
    trimestre===1
    ? "1er trimestre"
    : trimestre===2
    ? "2e trimestre"
    : "3e trimestre";


  document.getElementById(
    "titreClassement"
  ).textContent =
    "Classement " +
    classe +
    " — " +
    nomTrimestre;


  zone.innerHTML = `

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>Rang</th>

            <th>Nom et prénom</th>

            <th>Matricule</th>

            <th>Moyenne</th>

            <th>Mention</th>

            <th>Décision</th>

          </tr>

        </thead>

        <tbody>

          ${lignes}

        </tbody>

      </table>

    </div>

    <p style="margin-top:15px">
      <strong>
        ${liste.length}
      </strong>
      élève(s) classé(s).
      <br>
      Cliquez sur un élève pour le sélectionner.
    </p>
  `;

  afficherEleveSelectionne();
}


/* =================================
   SÉLECTION ÉLÈVE
================================= */

function selectionnerEleve(eleve){

  eleveActuel = eleve;

  document.getElementById("classe").value =
    eleve.classe || "";

  afficherClassement();
}


/* =================================
   OUVERTURE PAR MATRICULE
================================= */

function chargerMatriculeDepuisURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const matricule =
    params.get("matricule");

  if(!matricule) return;


  const eleve =
    eleves.find(
      e =>
        String(e.matricule || "")
        .toLowerCase() ===
        String(matricule)
        .toLowerCase()
    );


  if(!eleve){

    document.getElementById(
      "eleveSelectionne"
    ).innerHTML = `

      <div class="message">
        Élève introuvable pour le matricule
        <strong>${matricule}</strong>.
      </div>

    `;

    return;
  }


  eleveActuel = eleve;

  document.getElementById("classe").value =
    eleve.classe || "";

  afficherClassement();
}


/* =================================
   INITIALISATION
================================= */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    chargerMatriculeDepuisURL();

  }
);

</script>

</body>
</html>
