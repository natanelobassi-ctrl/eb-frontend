<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Paiements — Groupe Scolaire Étoile Brillante</title>

<script>
if(sessionStorage.getItem("EB_ADMIN")!=="OK"){
    location.replace("login.html");
}
</script>

<style>
:root{
    --bleu:#0A2A78;
    --bleu2:#123A9B;
    --or:#C9A227;
    --ivoire:#F7F4ED;
    --texte:#1F2937;
    --vert:#2E7D32;
    --rouge:#C62828;
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--ivoire);
    color:var(--texte);
}
header{
    background:linear-gradient(135deg,var(--bleu),var(--bleu2));
    color:white;
    padding:20px;
}
.header{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;opacity:.9}
.back{
    color:white;
    text-decoration:none;
    background:rgba(255,255,255,.15);
    padding:10px 14px;
    border-radius:8px;
}
.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}
.card{
    background:white;
    padding:22px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}
h2{color:var(--bleu);margin-top:0}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}
.field{
    display:flex;
    flex-direction:column;
}
.full{grid-column:1/-1}
label{
    font-weight:bold;
    margin-bottom:7px;
}
input,select{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}
button{
    border:0;
    border-radius:8px;
    padding:12px 17px;
    font-weight:bold;
    cursor:pointer;
}
.primary{background:var(--bleu);color:white}
.gold{background:var(--or);color:white}
.green{background:var(--vert);color:white}
.red{background:var(--rouge);color:white}
.gray{background:#666;color:white}
.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}
.info{
    background:#eef4ff;
    border-left:5px solid var(--bleu);
    padding:14px;
    border-radius:8px;
    margin-bottom:18px;
}
.message{
    display:none;
    padding:13px;
    border-radius:8px;
    margin-top:15px;
    font-weight:bold;
}
.success{background:#e8f5e9;color:#176b2c}
.error{background:#ffebee;color:#b71c1c}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}
th,td{
    border:1px solid #ddd;
    padding:9px;
    text-align:left;
}
th{
    background:var(--bleu);
    color:white;
}
.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}
.attente{background:#fff3cd;color:#856404}
.confirme{background:#d4edda;color:#155724}
.annule{background:#f8d7da;color:#721c24}
.receipt{
    display:none;
}
.receipt-box{
    max-width:700px;
    margin:auto;
    border:2px solid #222;
    padding:25px;
    background:white;
}
.receipt-head{
    text-align:center;
    border-bottom:2px solid #222;
    padding-bottom:15px;
}
.receipt-head h2{
    color:#111;
    margin:0;
}
.receipt-title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin:20px 0;
}
.receipt-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:8px 0;
    border-bottom:1px dotted #aaa;
}
.paid{
    text-align:center;
    border:3px solid #176b2c;
    color:#176b2c;
    font-size:24px;
    font-weight:bold;
    padding:12px;
    margin:20px 0;
}
.small{
    font-size:12px;
    color:#666;
}
@media(max-width:700px){
    .header{
        flex-direction:column;
        align-items:flex-start;
    }
    .grid{grid-template-columns:1fr}
    .full{grid-column:auto}
    table{
        font-size:12px;
    }
    .receipt-row{
        flex-direction:column;
        gap:3px;
    }
}
@media print{
    body *{
        visibility:hidden;
    }
    #zoneRecu,
    #zoneRecu *{
        visibility:visible;
    }
    #zoneRecu{
        display:block!important;
        position:absolute;
        left:0;
        top:0;
        width:100%;
    }
    .receipt-box{
        border:0;
        box-shadow:none;
    }
}
</style>
</head>

<body>

<header>
<div class="header">
    <div>
        <h1 id="titreEcole">Groupe Scolaire Étoile Brillante</h1>
        <p id="sousTitre">Gestion des paiements scolaires</p>
    </div>
    <a href="index.html" class="back">← Administration</a>
</div>
</header>

<main class="container">

<div class="card">
<h2>💰 Nouveau paiement</h2>

<div class="info">
    Le paiement Mobile Money est enregistré puis doit être
    <strong>confirmé par l'administration</strong> avant l'émission
    définitive du reçu payé.
</div>

<div class="grid">

<div class="field">
<label>Élève</label>
<select id="eleve">
<option value="">-- Sélectionner un élève --</option>
</select>
</div>

<div class="field">
<label>Matricule</label>
<input id="matricule" readonly>
</div>

<div class="field">
<label>Classe</label>
<input id="classe" readonly>
</div>

<div class="field">
<label>Montant</label>
<input id="montant" type="number" min="0" placeholder="Ex. 1500">
</div>

<div class="field">
<label>Motif</label>
<select id="motif">
<option value="Scolarité">Scolarité</option>
<option value="Inscription">Inscription</option>
<option value="Réinscription">
