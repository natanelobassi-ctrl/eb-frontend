<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiements - Groupe Scolaire Étoile Brillante</title>

<style>
body{font-family:Arial,sans-serif;background:#F7F4ED;margin:0}
header{background:#0A2A78;color:#fff;padding:20px}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
button{background:#198754;color:#fff;border:none;padding:12px 18px;border-radius:8px;font-weight:bold}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ddd}
th{background:#0A2A78;color:#fff}
.notice{background:#fff8dc;border-left:5px solid #C9A227;padding:12px;margin-bottom:15px}
</style>
</head>

<body>

<header>
<h1>Groupe Scolaire Étoile Brillante</h1>
<p>Administration — Paiements intelligents</p>
</header>

<div class="container">

<div class="card">

<h2>Nouveau paiement</h2>

<div class="notice">
Choisissez un élève : son nom, son prénom, sa classe et son matricule se remplissent automatiquement.
</div>

<div class="grid">

<div>
<label>Élève</label>
<select id="eleveSelect">
<option value="">Sélectionner un élève</option>
</select>
</div>

<div>
<label>Matricule</label>
<input id="matricule" readonly>
</div>

<div>
<label>Nom</label>
<input id="nom" readonly>
</div>

<div>
<label>Prénom</label>
<input id="prenom" readonly>
</div>

<div>
<label>Classe</label>
<input id="classe" readonly>
</div>

<div>
<label>Motif</label>
<select id="motif">
<option>Inscription</option>
<option>Réinscription</option>
<option>Scolarité</option>
<option>Internat</option>
<option>Examen</option>
</select>
</div>

<div>
<label>Montant (FCFA)</label>
<input id="montant" type="number">
</div>

<div>
<label>Référence Mobile Money</label>
<input id="reference">
</div>

<div>
<label>Date</label>
<input id="date" type="date">
</div>

</div>

<div style="margin-top:18px;">
<button onclick="enregistrer()">Enregistrer le paiement</button>
</div>

</div>

<div class="card">

<h2>Historique des paiements</h2>

<table>

<thead>
<tr>
<th>N°</th>
<th>Élève</th>
<th>Classe</th>
<th>Montant</th>
<th>Référence</th>
</tr>
</thead>

<tbody id="liste"></tbody>

</table>

</div>

</div>

<script>
const CLE_ELEVES="EB_ELEVES";
const CLE_PAIEMENTS="EB_PAIEMENTS";

let eleves=JSON.parse(localStorage.getItem(CLE_ELEVES)||"[]");
let paiements=JSON.parse(localStorage.getItem(CLE_PAIEMENTS)||"[]");

document.getElementById("date").value=new Date().toISOString().slice(0,10);

const select=document.getElementById("eleveSelect");

eleves.forEach((e,i)=>{
 const option=document.createElement("option");
 option.value=i;
 option.textContent=e.nom+" "+e.prenom+" ("+e.classe+")";
 select.appendChild(option);
});

select.onchange=function(){

 const e=eleves[this.value];
 if(!e)return;

 matricule.value=e.matricule;
 nom.value=e.nom;
 prenom.value=e.prenom;
 classe.value=e.classe;

};

function sauvegarder(){
 localStorage.setItem(CLE_PAIEMENTS,JSON.stringify(paiements));
}

function afficher(){

 liste.innerHTML="";

 [...paiements].reverse().forEach(p=>{

 liste.innerHTML+=`
 <tr>
 <td>${p.numero}</td>
 <td>${p.nom} ${p.prenom}</td>
 <td>${p.classe}</td>
 <td>${Number(p.montant).toLocaleString()} FCFA</td>
 <td>${p.reference}</td>
 </tr>`;

 });

}

function enregistrer(){

 if(!matricule.value){
  alert("Choisissez un élève.");
  return;
 }

 if(!montant.value){
  alert("Saisissez le montant.");
  return;
 }

 const paiement={

 numero:"EB-"+new Date().getFullYear()+"-"+String(paiements.length+1).padStart(5,"0"),

 matricule:matricule.value,
 nom:nom.value,
 prenom:prenom.value,
 classe:classe.value,
 motif:motif.value,
 montant:montant.value,
 reference:reference.value,
 date:date.value

 };

 paiements.push(paiement);

 sauvegarder();

 afficher();

 alert("Paiement enregistré avec succès.");

 montant.value="";
 reference.value="";

}

afficher();
</script>

</body>
</html>
