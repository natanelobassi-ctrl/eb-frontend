<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Classes — Administration | Groupe Scolaire Étoile Brillante</title>

<script>
if(sessionStorage.getItem("EB_ADMIN")!=="OK"){
  location.replace("login.html");
}
</script>

<style>
:root{
  --bleu:#0A2A78;
  --bleu-clair:#123A9B;
  --or:#C9A227;
  --ivoire:#F7F4ED;
  --vert:#16803C;
  --rouge:#C62828;
  --gris:#6B7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--ivoire);
  color:#1F2937;
}

header{
  background:linear-gradient(135deg,var(--bleu),var(--bleu-clair));
  color:white;
  padding:20px 15px;
}

header h1{
  margin:0 0 6px;
  font-size:25px;
}

header p{
  margin:0;
  opacity:.9;
}

.container{
  max-width:1400px;
  margin:25px auto;
  padding:0 15px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.topbar h2{
  margin:0;
  color:var(--bleu);
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  font-size:13px;
}

.btn-primary{background:var(--bleu);color:white}
.btn-or{background:var(--or);color:white}
.btn-green{background:var(--vert);color:white}
.btn-red{background:var(--rouge);color:white}
.btn-secondary{background:#e5e7eb;color:#333}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat span{
  color:var(--gris);
  font-size:14px;
}

.stat strong{
  display:block;
  margin-top:5px;
  color:var(--bleu);
  font-size:27px;
}

.filter-box{
  background:white;
  padding:18px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
  margin-bottom:20px;
}

.filter-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

.classes-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.class-card{
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.class-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.class-header h3{
  margin:0;
  color:var(--bleu);
}

.badge{
  padding:6px 9px;
  border-radius:20px;
  background:#e8eefc;
  color:var(--bleu);
  font-size:12px;
  font-weight:bold;
}

.progress{
  width:100%;
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0;
}

.progress-bar{
  height:100%;
  background:var(--vert);
  width:0%;
}

.progress-bar.full{
  background:var(--rouge);
}

.class-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin:12px 0;
}

.class-stat{
  background:#f5f6f8;
  padding:9px 5px;
  text-align:center;
  border-radius:8px;
}

.class-stat strong{
  display:block;
  color:var(--bleu);
  font-size:18px;
}

.class-stat small{
  font-size:11px;
  color:var(--gris);
}

.student-list{
  border-top:1px solid #eee;
  margin-top:12px;
  padding-top:10px;
  max-height:220px;
  overflow-y:auto;
}

.student{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 0;
  border-bottom:1px solid #f0f0f0;
}

.student-photo{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  background:var(--bleu);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:12px;
  font-weight:bold;
  flex-shrink:0;
}

.student-info{
  flex:1;
  min-width:0;
}

.student-info strong{
  display:block;
  font-size:13px;
}

.student-info small{
  color:var(--gris);
  font-size:11px;
}

.empty{
  text-align:center;
  color:var(--gris);
  padding:25px 10px;
}

@media(max-width:1000px){
  .classes-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .classes-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Groupe Scolaire Étoile Brillante</h1>
  <p>Administration — Gestion des classes et des inscriptions</p>
</header>

<div class="container">

  <div class="topbar">

    <div>
      <h2>Classes</h2>
      <p>Effectifs, listes des inscrits et taux d'occupation</p>
    </div>

    <div class="actions">
      <a href="../inscription.html" class="btn btn-primary">
        + Inscrire un élève
      </a>

      <a href="eleves.html" class="btn btn-or">
        👥 Tous les élèves
      </a>

      <a href="index.html" class="btn btn-secondary">
        ← Administration
      </a>
    </div>

  </div>


  <!-- STATISTIQUES GENERALES -->

  <div class="stats">

    <div class="stat">
      <span>Total élèves inscrits</span>
      <strong id="totalEleves">0</strong>
    </div>

    <div class="stat">
      <span>Filles</span>
      <strong id="totalFilles">0</strong>
    </div>

    <div class="stat">
      <span>Garçons</span>
      <strong id="totalGarcons">0</strong>
    </div>

    <div class="stat">
      <span>Classes occupées</span>
      <strong id="classesOccupees">0</strong>
    </div>

  </div>


  <!-- RECHERCHE -->

  <div class="filter-box">

    <div class="filter-grid">

      <input
        type="text"
        id="recherche"
        placeholder="🔎 Rechercher une classe ou un élève..."
      >

      <select id="filtreNiveau">
        <option value="">Tous les niveaux</option>
        <option value="prescolaire">Préscolaire</option>
        <option value="primaire">Primaire</option>
        <option value="college">Collège</option>
        <option value="lycee">Lycée</option>
      </select>

    </div>

  </div>


  <!-- CLASSES -->

  <div id="classesGrid" class="classes-grid"></div>

</div>


<script>

const CLE_ELEVES = "EB_ELEVES";

const classes = [

  {nom:"P1", niveau:"prescolaire", capacite:30},
  {nom:"P2", niveau:"prescolaire", capacite:30},
  {nom:"P3", niveau:"prescolaire", capacite:30},

  {nom:"CP1", niveau:"primaire", capacite:30},
  {nom:"CP2", niveau:"primaire", capacite:30},
  {nom:"CE1", niveau:"primaire", capacite:30},
  {nom:"CE2", niveau:"primaire", capacite:30},
  {nom:"CM1", niveau:"primaire", capacite:30},
  {nom:"CM2", niveau:"primaire", capacite:30},

  {nom:"6e", niveau:"college", capacite:30},
  {nom:"5e", niveau:"college", capacite:30},
  {nom:"4e", niveau:"college", capacite:30},
  {nom:"3e", niveau:"college", capacite:30},

  {nom:"Seconde", niveau:"lycee", capacite:30},
  {nom:"STC", niveau:"lycee", capacite:30},
  {nom:"Première A", niveau:"lycee", capacite:30},
  {nom:"Première D", niveau:"lycee", capacite:30},
  {nom:"Terminale A", niveau:"lycee", capacite:30},
  {nom:"Terminale D", niveau:"lycee", capacite:30}

];


let eleves = [];


/* ================================
   CHARGER LES ELEVES
================================ */

function chargerEleves(){

  try{

    const data = localStorage.getItem(CLE_ELEVES);

    eleves = data ? JSON.parse(data) : [];

    if(!Array.isArray(eleves)){
      eleves = [];
    }

  }catch(error){

    console.error(error);

    eleves = [];

  }

  afficherClasses();

}


/* ================================
   NORMALISER
================================ */

function normaliser(value){

  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/* ================================
   NIVEAU
================================ */

function appartientNiveau(classe,niveau){

  const c = normaliser(classe);

  if(niveau === "prescolaire"){
    return ["p1","p2","p3"].includes(c);
  }

  if(niveau === "primaire"){
    return [
      "cp1","cp2","ce1","ce2","cm1","cm2"
    ].includes(c);
  }

  if(niveau === "college"){
    return [
      "6e","5e","4e","3e"
    ].includes(c);
  }

  if(niveau === "lycee"){
    return [
      "seconde",
      "stc",
      "premiere a",
      "premiere d",
      "terminale a",
      "terminale d"
    ].includes(c);
  }

  return true;

}


/* ================================
   AFFICHER
================================ */

function afficherClasses(){

  const grid =
    document.getElementById("classesGrid");

  const recherche =
    normaliser(
      document.getElementById("recherche").value
    );

  const niveau =
    document.getElementById("filtreNiveau").value;

  grid.innerHTML = "";

  let total = 0;
  let filles = 0;
  let garcons = 0;
  let occupees = 0;


  classes.forEach(classe=>{

    const inscrits = eleves.filter(e=>{

      const c =
        normaliser(
          e.classe ||
          e.salle ||
          ""
        );

      return c === normaliser(classe.nom);

    });


    total += inscrits.length;

    filles += inscrits.filter(
      e => e.sexe === "F"
    ).length;

    garcons += inscrits.filter(
      e => e.sexe === "M"
    ).length;

    if(inscrits.length > 0){
      occupees++;
    }


    if(niveau && classe.niveau !== niveau){
      return;
    }


    let texteRecherche =
      normaliser(classe.nom);


    inscrits.forEach(e=>{

      texteRecherche +=
        " " +
        normaliser(e.nom) +
        " " +
        normaliser(e.prenom) +
        " " +
        normaliser(e.matricule);

    });


    if(
      recherche &&
      !texteRecherche.includes(recherche)
    ){
      return;
    }


    const pourcentage =
      Math.min(
        100,
        Math.round(
          (inscrits.length / classe.capacite) * 100
        )
      );


    let listeHTML = "";


    if(inscrits.length === 0){

      listeHTML = `
        <div class="empty">
          Aucun élève inscrit dans cette classe.
        </div>
      `;

    }else{

      inscrits.forEach(e=>{

        const photo =
          e.photo || "";

        const initiales =
          obtenirInitiales(e);


        let photoHTML = "";

        if(photo){

          photoHTML = `
            <img
              src="${photo}"
              class="student-photo"
              alt="Photo"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
            >

            <div
              class="student-photo"
              style="display:none"
            >
              ${initiales}
            </div>
          `;

        }else{

          photoHTML = `
            <div class="student-photo">
              ${initiales}
            </div>
          `;

        }


        const index =
          eleves.indexOf(e);


        listeHTML += `

          <div class="student">

            ${photoHTML}

            <div class="student-info">

              <strong>
                ${escapeHTML(
                  (e.nom || "") +
                  " " +
                  (e.prenom || "")
                )}
              </strong>

              <small>
                ${escapeHTML(
                  e.matricule || ""
                )}
              </small>

            </div>

            <button
              class="btn btn-secondary"
              style="padding:6px 8px"
              onclick="ouvrirEleve(${index})"
            >
              Voir
            </button>

          </div>

        `;

      });

    }


    const card =
      document.createElement("div");

    card.className =
      "class-card";


    card.innerHTML = `

      <div class="class-header">

        <h3>
          ${escapeHTML(classe.nom)}
        </h3>

        <span class="badge">
          ${inscrits.length}/${classe.capacite}
        </span>

      </div>


      <div>

        <strong>
          Taux d'occupation :
          ${pourcentage}%
        </strong>

        <div class="progress">

          <div
            class="progress-bar ${pourcentage >= 100 ? "full" : ""}"
            style="width:${pourcentage}%"
          ></div>

        </div>

      </div>


      <div class="class-stats">

        <div class="class-stat">
          <strong>${inscrits.length}</strong>
          <small>Inscrits</small>
        </div>

        <div class="class-stat">
          <strong>
            ${inscrits.filter(e=>e.sexe==="F").length}
          </strong>
          <small>Filles</small>
        </div>

        <div class="class-stat">
          <strong>
            ${inscrits.filter(e=>e.sexe==="M").length}
          </strong>
          <small>Garçons</small>
        </div>

      </div>


      <div class="student-list">

        ${listeHTML}

      </div>


      <br>

      <button
        class="btn btn-primary"
        onclick="voirClasse('${escapeAttribute(classe.nom)}')"
      >
        📋 Voir la classe
      </button>

    `;


    grid.appendChild(card);

  });


  document.getElementById("totalEleves").textContent =
    total;

  document.getElementById("totalFilles").textContent =
    filles;

  document.getElementById("totalGarcons").textContent =
    garcons;

  document.getElementById("classesOccupees").textContent =
    occupees;

}


/* ================================
   VOIR UN ELEVE
================================ */

function ouvrirEleve(index){

  if(index < 0 || !eleves[index]){
    return;
  }

  const e =
    eleves[index];

  let message =
    "FICHE ÉLÈVE\n\n" +

    "Matricule : " +
    (e.matricule || "") +

    "\nNom : " +
    (e.nom || "") +

    "\nPrénom : " +
    (e.prenom || "") +

    "\nClasse : " +
    (e.classe || e.salle || "") +

    "\nSexe : " +
    (e.sexe === "F" ? "Fille" : "Garçon");


  alert(message);

}


/* ================================
   VOIR CLASSE
================================ */

function voirClasse(nomClasse){

  const inscrits =
    eleves.filter(e =>
      normaliser(
        e.classe ||
        e.salle ||
        ""
      ) === normaliser(nomClasse)
    );


  if(inscrits.length === 0){

    alert(
      "Aucun élève inscrit en " +
      nomClasse +
      "."
    );

    return;

  }


  let texte =
    "LISTE DES INSCRITS — " +
    nomClasse +
    "\n\n";


  inscrits.forEach((e,i)=>{

    texte +=
      (i + 1) +
      ". " +
      (e.nom || "") +
      " " +
      (e.prenom || "") +
      " — " +
      (e.matricule || "") +
      "\n";

  });


  alert(texte);

}


/* ================================
   INITIALES
================================ */

function obtenirInitiales(e){

  const nom =
    String(e.nom || "").trim();

  const prenom =
    String(e.prenom || "").trim();

  let resultat = "";

  if(nom){
    resultat +=
      nom.charAt(0).toUpperCase();
  }

  if(prenom){
    resultat +=
      prenom.charAt(0).toUpperCase();
  }

  return resultat || "EB";

}


/* ================================
   SECURITE HTML
================================ */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* ================================
   RECHERCHE
================================ */

document.getElementById("recherche")
  .addEventListener(
    "input",
    afficherClasses
  );


document.getElementById("filtreNiveau")
  .addEventListener(
    "change",
    afficherClasses
  );


/* ================================
   ACTUALISATION AUTOMATIQUE
================================ */

window.addEventListener(
  "storage",
  function(event){

    if(event.key === CLE_ELEVES){
      chargerEleves();
    }

  }
);


/* ================================
   LANCEMENT
================================ */

chargerEleves();

</script>

</body>
</html>
