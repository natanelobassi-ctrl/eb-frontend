
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualités - Groupe Scolaire Étoile Brillante</title>

<style>
:root{
 --bleu:#0A2A78;
 --bleu2:#123A9B;
 --or:#C9A227;
 --ivoire:#F7F4ED;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,Helvetica,sans-serif;background:var(--ivoire);color:#1F2937;}
header{background:linear-gradient(135deg,var(--bleu),var(--bleu2));color:white;padding:22px;}
.container{width:94%;max-width:1100px;margin:auto;}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;}
nav a{color:white;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:bold;}
nav a:hover{background:rgba(255,255,255,.15);}
.hero{text-align:center;padding:35px 15px;}
.hero h2{color:var(--bleu);font-size:2rem;}
.hero p{margin-top:10px;}
.news{display:grid;gap:20px;margin:25px 0;}
.card{background:white;border-radius:15px;padding:22px;box-shadow:0 5px 18px rgba(0,0,0,.08);}
.date{color:#666;font-size:.9rem;margin-bottom:10px;}
.badge{display:inline-block;background:var(--or);color:#111;padding:5px 10px;border-radius:20px;font-size:.8rem;font-weight:bold;margin-bottom:10px;}
footer{background:var(--bleu);color:white;text-align:center;padding:20px;margin-top:30px;}
</style>
</head>

<body>

<header>
<div class="container">
<h1>Groupe Scolaire Étoile Brillante</h1>
<p>Excellence • Discipline • Innovation</p>

<nav>
<a href="index.html">Accueil</a>
<a href="ecole.html">L'École</a>
<a href="cycles.html">Cycles</a>
<a href="resultats.html">Résultats</a>
<a href="galerie.html">Galerie</a>
<a href="actualites.html">Actualités</a>
<a href="contact.html">Contact</a>
</nav>
</div>
</header>

<section class="hero">
<h2>Actualités de l'école</h2>
<p>Les informations publiées par l'administration apparaissent automatiquement ici.</p>
</section>

<div class="container">
<div id="listeActualites" class="news"></div>
</div>

<footer>
Groupe Scolaire Étoile Brillante • Brazzaville
</footer>

<script>
const actualites=JSON.parse(localStorage.getItem("EB_ACTUALITES")||"[]");

const liste=document.getElementById("listeActualites");

const publiees=actualites.filter(a=>a.statut==="Publié");

if(publiees.length===0){
 liste.innerHTML=`
 <div class="card">
   <span class="badge">Information</span>
   <h3>Aucune actualité publiée</h3>
   <p>Les prochaines annonces de l'administration apparaîtront ici.</p>
 </div>`;
}else{
 publiees.reverse().forEach(a=>{
   liste.innerHTML+=`
   <div class="card">
      <span class="badge">${a.categorie||"Actualité"}</span>
      <div class="date">${a.date||""}</div>
      <h3>${a.titre}</h3>
      <p style="margin-top:12px;">${a.contenu}</p>
   </div>`;
 });
}
</script>

</body>
</html>
