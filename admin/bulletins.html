<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulletins - Groupe Scolaire Étoile Brillante</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  color:#1f2937;
}

header{
  background:#0A2A78;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:6px 0 0;
}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  color:#0A2A78;
  margin-top:0;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

input,
select,
button{
  padding:11px;
  border-radius:7px;
  border:1px solid #ccc;
  font-size:14px;
}

input,
select{
  flex:1;
  min-width:180px;
}

button{
  background:#0A2A78;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

.btn-print{
  background:#C9A227;
  color:#111;
}

.btn-retour{
  background:#555;
}

.resultats-recherche{
  margin-top:12px;
  display:grid;
  gap:8px;
}

.resultat-eleve{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#f8fafc;
  cursor:pointer;
}

.resultat-eleve:hover{
  background:#eef3ff;
}

.info-eleve{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-top:15px;
}

.info-box{
  background:#f5f7fb;
  border-radius:8px;
  padding:12px;
}

.info-box strong{
  display:block;
  color:#0A2A78;
  margin-bottom:4px;
}

.bulletin{
  background:white;
  padding:25px;
  border:1px solid #ddd;
  margin-top:20px;
}

.entete-ecole{
  text-align:center;
  border-bottom:3px solid #0A2A78;
  padding-bottom:15px;
  margin-bottom:15px;
}

.entete-ecole h1{
  color:#0A2A78;
  margin:0;
  font-size:25px;
}

.entete-ecole p{
  margin:4px 0;
}

.titre-bulletin{
  text-align:center;
  margin:15px 0;
}

.titre-bulletin h2{
  margin:5px 0;
  text-transform:uppercase;
}

.titre-bulletin h3{
  margin:5px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,
td{
  border:1px solid #777;
  padding:7px;
  text-align:center;
  font-size:13px;
}

th{
  background:#0A2A78;
  color:white;
}

td:first-child{
  text-align:left;
}

.total-box{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-top:18px;
}

.total-item{
  border:1px solid #ccc;
  padding:12px;
  text-align:center;
  border-radius:7px;
}

.total-item strong{
  display:block;
  color:#0A2A78;
  margin-bottom:5px;
}

.decision{
  font-weight:bold;
  font-size:18px;
}

.admis{
  color:green;
}

.echoue{
  color:#b00020;
}

.signature-zone{
  display:flex;
  justify-content:space-between;
  margin-top:50px;
  text-align:center;
}

.signature{
  width:40%;
}

.signature-line{
  border-top:1px solid #333;
  margin-top:55px;
  padding-top:8px;
}

.message-vide{
  text-align:center;
  padding:30px;
  color:#777;
}

.erreur{
  color:#b00020;
  text-align:center;
  padding:20px;
}

@media(max-width:700px){

  .bulletin{
    padding:10px;
  }

  table{
    font-size:11px;
  }

  th,
  td{
    padding:5px;
  }

  .signature-zone{
    flex-direction:column;
    gap:30px;
  }

  .signature{
    width:100%;
  }

}

@media print{

  body{
    background:white;
  }

  header,
  .recherche,
  .actions{
    display:none!important;
  }

  .container{
    margin:0;
    padding:0;
    max-width:none;
  }

  .card{
    box-shadow:none;
    padding:0;
  }

  .bulletin{
    border:none;
    margin:0;
    padding:10px;
  }

  @page{
    size:A4 portrait;
    margin:12mm;
  }

}
</style>
</head>

<header>

  <h1>Groupe S
