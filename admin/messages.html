<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Groupe Scolaire Étoile Brillante</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fa;
  color:#1f2937;
}

header{
  background:#0A2A78;
  color:white;
  padding:22px 18px;
}

header h1{
  margin:0 0 6px;
  font-size:25px;
}

header p{
  margin:0;
  opacity:.9;
}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#0A2A78;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
  font-size:14px;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd3df;
  border-radius:8px;
  font-size:14px;
  font-family:inherit;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary{
  background:#0A2A78;
  color:white;
}

.btn-gold{
  background:#C9A227;
  color:white;
}

.btn-danger{
  background:#c62828;
  color:white;
}

.btn-secondary{
  background:#6b7280;
  color:white;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.message{
  border:1px solid #ddd;
  border-left:5px solid #0A2A78;
  border-radius:10px;
  padding:16px;
  margin-bottom:12px;
  background:#fff;
}

.message h3{
  margin:0 0 8px;
  color:#0A2A78;
}

.meta{
  color:#6b7280;
  font-size:13px;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  background:#e8eefc;
  color:#0A2A78;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-right:5px;
}

.message-content{
  white-space:pre-wrap;
  line-height:1.6;
}

.empty{
  text-align:center;
  padding:35px;
  color:#6b7280;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:12px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat strong{
  display:block;
  color:#0A2A78;
  font-size:25px;
  margin-top:5px;
}

@media(max-width:800px){
  .grid,
  .filters,
  .stats{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media print{
  header,
  .form-card,
  .filters-card,
  .no-print,
  .actions,
  .stats{
    display:none!important;
  }

  body{
    background:white;
  }

  .card{
    box-shadow:none;
  }
}
</style>
</head>

<body>

<header>
  <h1>📢 Gestion des messages</h1>
  <p>Groupe Scolaire Étoile Brillante — Administration</p>
</header>

<div class="container">

  <!-- STATISTIQUES -->
  <div class="stats no-print">

    <div class="stat">
      Total des messages
      <strong id="totalMessages">0</strong>
    </div>

    <div class="stat">
      Messages importants
      <strong id="totalImportants">0</strong>
    </div>

    <div class="stat">
      Dernier message
      <strong id="dernierMessage">—</strong>
    </div>

  </div>

  <!-- FORMULAIRE -->
  <div class="card form-card">

    <h2 id="formTitle">✉️ Nouveau message</h2>

    <div class="grid">

      <div>
        <label>Destinataire *</label>

        <select id="destinataire">
          <option value="">Sélectionner</option>
          <option>Parents</option>
          <option>Élèves</option>
          <option>Enseignants</option>
          <option>Personnel administratif</option>
          <option>Direction</option>
          <option>Collège</option>
          <option>Lycée</option>
          <option>Primaire</option>
          <option>Préscolaire</option>
          <option>Tous</option>
        </select>
      </div>

      <div>
        <label>Type de message</label>

        <select id="typeMessage">
          <option>Information</option>
          <option>Annonce</option>
          <option>Rappel</option>
          <option>Réunion</option>
          <option>Urgent</option>
          <option>Convocation</option>
          <option>Félicitations</option>
        </select>
      </div>

      <div>
        <label>Priorité</label>

        <select id="priorite">
          <option>Normale</option>
          <option>Importante</option>
          <option>Urgente</option>
        </select>
      </div>

      <div class="full">
        <label>Objet *</label>

        <input
          type="text"
          id="objet"
          placeholder="Objet du message">
      </div>

      <div class="full">
        <label>Contenu du message *</label>

        <textarea
          id="contenu"
          placeholder="Rédigez votre message ici..."></textarea>
      </div>

    </div>

    <div class="actions">

      <button
        class="btn-primary"
        onclick="enregistrerMessage()">
        💾 Enregistrer
      </button>

      <button
        class="btn-secondary"
        onclick="reinitialiser()">
        ↩ Réinitialiser
      </button>

    </div>

  </div>

  <!-- RECHERCHE -->
  <div class="card filters-card no-print">

    <h2>🔎 Rechercher un message</h2>

    <div class="filters">

      <div>
        <label>Destinataire</label>

        <select
          id="filtreDestinataire"
          onchange="afficherMessages()">

          <option value="">Tous</option>
          <option>Parents</option>
          <option>Élèves</option>
          <option>Enseignants</option>
          <option>Personnel administratif</option>
          <option>Direction</option>
          <option>Collège</option>
          <option>Lycée</option>
          <option>Primaire</option>
          <option>Préscolaire</option>
          <option>Tous</option>

        </select>
      </div>

      <div>
        <label>Type</label>

        <select
          id="filtreType"
          onchange="afficherMessages()">

          <option value="">Tous</option>
          <option>Information</option>
          <option>Annonce</option>
          <option>Rappel</option>
          <option>Réunion</option>
          <option>Urgent</option>
          <option>Convocation</option>
          <option>Félicitations</option>

        </select>
      </div>

      <div>
        <label>Recherche</label>

        <input
          type="text"
          id="recherche"
          placeholder="Objet ou contenu..."
          oninput="afficherMessages()">

      </div>

    </div>

    <div class="actions">

      <button
        class="btn-gold"
        onclick="window.print()">
        🖨️ Imprimer
      </button>

      <button
        class="btn-secondary"
        onclick="exporterCSV()">
        📥 Exporter
      </button>

      <button
        class="btn-danger"
        onclick="supprimerTous()">
        🗑️ Tout supprimer
      </button>

    </div>

  </div>

  <!-- LISTE -->
  <div class="card">

    <h2>📋 Messages enregistrés</h2>

    <div id="listeMessages"></div>

  </div>

</div>

<script>

const CLE_MESSAGES = "EB_MESSAGES";

let messages = [];
let indexModification = -1;


/* =========================
   CHARGEMENT
========================= */

function chargerMessages(){

  try{

    messages =
      JSON.parse(
        localStorage.getItem(CLE_MESSAGES)
      ) || [];

  }catch(e){

    messages = [];

  }

  afficherMessages();

}


/* =========================
   SAUVEGARDE
========================= */

function sauvegarder(){

  localStorage.setItem(
    CLE_MESSAGES,
    JSON.stringify(messages)
  );

}


/* =========================
   ENREGISTRER
========================= */

function enregistrerMessage(){

  const destinataire =
    document.getElementById("destinataire").value;

  const type =
    document.getElementById("typeMessage").value;

  const priorite =
    document.getElementById("priorite").value;

  const objet =
    document.getElementById("objet").value.trim();

  const contenu =
    document.getElementById("contenu").value.trim();

  if(
    !destinataire ||
    !objet ||
    !contenu
  ){

    alert(
      "Veuillez remplir les champs obligatoires."
    );

    return;

  }

  const maintenant =
    new Date();

  const message = {

    id:
      indexModification >= 0
      ? messages[indexModification].id
      : Date.now(),

    destinataire,
    type,
    priorite,
    objet,
    contenu,

    date:
      indexModification >= 0
      ? messages[indexModification].date
      : maintenant.toLocaleString("fr-FR")

  };


  if(indexModification >= 0){

    messages[indexModification] =
      message;

    alert(
      "Message modifié avec succès."
    );

  }else{

    messages.unshift(message);

    alert(
      "Message enregistré avec succès."
    );

  }


  sauvegarder();

  reinitialiser();

  afficherMessages();

}


/* =========================
   AFFICHAGE
========================= */

function afficherMessages(){

  const zone =
    document.getElementById("listeMessages");

  const filtreDestinataire =
    document.getElementById(
      "filtreDestinataire"
    ).value;

  const filtreType =
    document.getElementById(
      "filtreType"
    ).value;

  const recherche =
    document.getElementById(
      "recherche"
    ).value
    .toLowerCase()
    .trim();


  let liste =
    [...messages];


  if(filtreDestinataire){

    liste =
      liste.filter(
        m =>
          m.destinataire ===
          filtreDestinataire
      );

  }


  if(filtreType){

    liste =
      liste.filter(
        m =>
          m.type ===
          filtreType
      );

  }


  if(recherche){

    liste =
      liste.filter(m => {

        const texte =
          (
            m.objet +
            " " +
            m.contenu +
            " " +
            m.destinataire
          ).toLowerCase();

        return texte.includes(recherche);

      });

  }


  zone.innerHTML = "";


  if(liste.length === 0){

    zone.innerHTML = `
      <div class="empty">
        Aucun message enregistré.
      </div>
    `;

  }else{

    liste.forEach(m => {

      const index =
        messages.findIndex(
          x => x.id === m.id
        );

      const div =
        document.createElement("div");

      div.className =
        "message";


      div.innerHTML = `

        <h3>
          ${escapeHTML(m.objet)}
        </h3>

        <div class="meta">

          <span class="badge">
            ${escapeHTML(m.destinataire)}
          </span>

          <span class="badge">
            ${escapeHTML(m.type)}
          </span>

          <span class="badge">
            ${escapeHTML(m.priorite)}
          </span>

          <br><br>

          Date :
          ${escapeHTML(m.date)}

        </div>

        <div class="message-content">
          ${escapeHTML(m.contenu)}
        </div>

        <div class="actions no-print">

          <button
            class="btn-gold"
            onclick="modifierMessage(${index})">
            ✏️ Modifier
          </button>

          <button
            class="btn-danger"
            onclick="supprimerMessage(${index})">
            🗑️ Supprimer
          </button>

        </div>

      `;

      zone.appendChild(div);

    });

  }


  mettreAJourStats();

}


/* =========================
   MODIFICATION
========================= */

function modifierMessage(index){

  const m =
    messages[index];

  if(!m) return;


  document.getElementById(
    "destinataire"
  ).value =
    m.destinataire;

  document.getElementById(
    "typeMessage"
  ).value =
    m.type;

  document.getElementById(
    "priorite"
  ).value =
    m.priorite;

  document.getElementById(
    "objet"
  ).value =
    m.objet;

  document.getElementById(
    "contenu"
  ).value =
    m.contenu;


  indexModification =
    index;


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Modifier le message";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   SUPPRESSION
========================= */

function supprimerMessage(index){

  if(!confirm(
    "Voulez-vous supprimer ce message ?"
  )) return;


  messages.splice(index,1);

  sauvegarder();

  afficherMessages();

}


/* =========================
   SUPPRIMER TOUS
========================= */

function supprimerTous(){

  if(messages.length === 0){

    alert(
      "Aucun message à supprimer."
    );

    return;

  }


  if(!confirm(
    "Voulez-vous supprimer tous les messages ?"
  )) return;


  messages = [];

  sauvegarder();

  afficherMessages();

}


/* =========================
   RESET
========================= */

function reinitialiser(){

  indexModification = -1;

  document.getElementById(
    "formTitle"
  ).textContent =
    "✉️ Nouveau message";


  document.getElementById(
    "
