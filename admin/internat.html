<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internat - Groupe Scolaire Étoile Brillante</title>

<style>
:root{
 --bleu:#0A2A78;
 --bleu2:#123A9B;
 --or:#C9A227;
 --ivoire:#F7F4ED;
 --vert:#198754;
 --rouge:#C62828;
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--ivoire);
 color:#1F2937;
}

header{
 background:linear-gradient(135deg,var(--bleu),var(--bleu2));
 color:white;
 padding:20px;
}

.container{
 width:95%;
 max-width:1200px;
 margin:auto;
}

nav{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:15px;
}

nav a{
 color:white;
 text-decoration:none;
 padding:8px 12px;
 border-radius:8px;
 font-weight:bold;
}

nav a:hover{
 background:rgba(255,255,255,.15);
}

.card{
 background:white;
 border-radius:15px;
 padding:22px;
 margin:22px 0;
 box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:15px;
}

label{
 display:block;
 font-weight:bold;
 margin-bottom:6px;
}

input,select{
 width:100%;
 padding:10px;
 border:1px solid #ccc;
 border-radius:8px;
}

button{
 border:none;
 border-radius:8px;
 padding:12px 18px;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

.btn-save{background:var(--vert);}
.btn-print{background:var(--bleu);}
.btn-sortie{background:var(--rouge);}

.table-wrap{overflow:auto;}

table{
 width:100%;
 border-collapse:collapse;
 min-width:900px;
}

th,td{
 border-bottom:1px solid #ddd;
 padding:10px;
 text-align:left;
}

th{
 background:var(--bleu);
 color:white;
}

.badge{
 display:inline-block;
 padding:4px 10px;
 border-radius:20px;
 font-size:.8rem;
 font-weight:bold;
}

.present{background:#d9f5e5;color:#08753a;}
.sorti{background:#fde2e2;color:#b00020;}

footer{
 background:var(--bleu);
 color:white;
 text-align:center;
 padding:20px;
 margin-top:30px;
}

@media print{
 nav,button{display:none;}
 .card{box-shadow:none;}
 body{background:white;}
}
</style>
</head>

<body>

<header>

<div class="container">

<h1>Groupe Scolaire Étoile Brillante</h1>

<p>Administration — Gestion de l'Internat</p>

<nav>
<a href="index.html">Dashboard</a>
<a href="eleves.html">Élèves</a>
<a href="internat.html">Internat</a>
<a href="paiements.html">Paiements</a>
<a href="bulletins.html">Bulletins</a>
<a href="cartes.html">Cartes</a>
</nav>

</div>

</header>

<div class="container">

<div class="card">

<h2>Nouvel interne</h2>

<div class="grid">

<div>
<label>Élève</label>
<select id="eleveSelect">
<option value="">Sélectionner un élève</option>
</select>
</div>

<div>
<label>Matricule</label>
<input id="matricule" readonly>
</div>

<div>
<label>Nom</label>
<input id="nom" readonly>
</div>

<div>
<label>Prénom</label>
<input id="prenom" readonly>
</div>

<div>
<label>Classe</label>
<input id="classe" readonly>
</div>

<div>
<label>Dortoir</label>
<select id="dortoir">
<option>Dortoir A</option>
<option>Dortoir B</option>
<option>Dortoir C</option>
<option>Dortoir Filles</option>
<option>Dortoir Garçons</option>
</select>
</div>

<div>
<label>Chambre</label>
<input id="chambre" placeholder="Ex : C-03">
</div>

<div>
<label>Lit</label>
<input id="lit" placeholder="Ex : Lit 12">
</div>

<div>
<label>Date d'entrée</label>
<input id="dateEntree" type="date">
</div>

<div>
<label>Responsable</label>
<input value="Hermann NIANGA" readonly>
</div>

</div>

<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">

<button class="btn-save" onclick="enregistrer()">
💾 Enregistrer
</button>

<button class="btn-print" onclick="window.print()">
🖨 Imprimer
</button>

</div>

</div>

<div class="card">

<h2>Liste des internes</h2>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>Matricule</th>
<th>Élève</th>
<th>Classe</th>
<th>Dortoir</th>
<th>Chambre</th>
<th>Lit</th>
<th>Statut</th>
<th>Action</th>
</tr>

</thead>

<tbody id="liste"></tbody>

</table>

</div>

</div>

</div>

<footer>

Groupe Scolaire Étoile Brillante • Brazzaville

</footer>

<script>

const CLE_E="EB_ELEVES";
const CLE_I="EB_INTERNAT";

let eleves=JSON.parse(localStorage.getItem(CLE_E)||"[]");
let internes=JSON.parse(localStorage.getItem(CLE_I)||"[]");

dateEntree.value=new Date().toISOString().slice(0,10);

eleves.forEach((e,i)=>{

 const option=document.createElement("option");

 option.value=i;

 option.textContent=e.nom+" "+e.prenom+" ("+e.classe+")";

 eleveSelect.appendChild(option);

});

eleveSelect.onchange=function(){

 const e=eleves[this.value];

 if(!e)return;

 matricule.value=e.matricule;
 nom.value=e.nom;
 prenom.value=e.prenom;
 classe.value=e.classe;

};

function sauver(){

 localStorage.setItem(CLE_I,JSON.stringify(internes));

}

function afficher(){

 liste.innerHTML="";

 [...internes].reverse().forEach((i,index)=>{

  liste.innerHTML+=`
  <tr>
   <td>${i.matricule}</td>
   <td>${i.nom} ${i.prenom}</td>
   <td>${i.classe}</td>
   <td>${i.dortoir}</td>
   <td>${i.chambre}</td>
   <td>${i.lit}</td>
   <td><span class="badge ${i.statut==="Présent"?"present":"sorti"}">${i.statut}</span></td>
   <td>
    <button class="btn-sortie" onclick="sortie(${internes.length-1-index})">
     Sortie
    </button>
   </td>
  </tr>`;

 });

}

function enregistrer(){

 if(!matricule.value){

  alert("Sélectionnez un élève.");

  return;

 }

 internes.push({

  matricule:matricule.value,
  nom:nom.value,
  prenom:prenom.value,
  classe:classe.value,
  dortoir:dortoir.value,
  chambre:chambre.value,
  lit:lit.value,
  dateEntree:dateEntree.value,
  responsable:"Hermann NIANGA",
  statut:"Présent"

 });

 sauver();

 afficher();

 chambre.value="";
 lit.value="";

 alert("Interne enregistré.");

}

function sortie(index){

 if(!confirm("Enregistrer la sortie de cet interne ?")) return;

 internes[index].statut="Sorti";

 internes[index].dateSortie=new Date().toLocaleDateString("fr-FR");

 sauver();

 afficher();

}

afficher();

</script>

</body>
</html>
