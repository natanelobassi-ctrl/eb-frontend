<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Élèves — Administration | Groupe Scolaire Étoile Brillante</title>

<style>
:root{
  --bleu:#0A2A78;
  --bleu2:#123A9B;
  --or:#C9A227;
  --ivoire:#F7F4ED;
  --blanc:#fff;
  --texte:#1F2937;
  --danger:#b91c1c;
  --vert:#15803d;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f9;
  color:var(--texte);
}

header{
  background:linear-gradient(135deg,var(--bleu),var(--bleu2));
  color:white;
  padding:20px;
}

.header-content{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  opacity:.9;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  font-weight:bold;
  font-size:14px;
}

.btn-primary{
  background:var(--bleu);
  color:white;
}

.btn-gold{
  background:var(--or);
  color:white;
}

.btn-light{
  background:white;
  color:var(--bleu);
}

.btn-green{
  background:var(--vert);
  color:white;
}

.btn-danger{
  background:var(--danger);
  color:white;
}

main{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  text-align:center;
}

.stat strong{
  display:block;
  font-size:30px;
  color:var(--bleu);
}

.stat span{
  color:#666;
}

.panel{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.panel h2{
  margin-top:0;
  color:var(--bleu);
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

  padding:10
