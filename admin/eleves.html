<style>
:root{
  --bleu:#0A2A78;
  --bleu-clair:#123A9B;
  --or:#C9A227;
  --ivoire:#F7F4ED;
  --vert:#16803C;
  --rouge:#C62828;
  --gris:#6B7280;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--ivoire);
  color:#1F2937;
}

header{
  background:linear-gradient(135deg,var(--bleu),var(--bleu-clair));

header h1{

header p{

  opacity:.9;

.container{

  margin:25px auto;
  padding:0 15px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.topbar h2{
  margin:0;
  color:var(--bleu);
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:9px;
  padding:10px 14px;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
  display:inline-block;
  font-size:13px;
}

.btn-primary{
  background:var(--bleu);
  color:white;
}

.btn-or{
  background:var(--or);
  color:white;
}

.btn-secondary{
  background:#e8e8e8;

.btn-green{

.btn-red{

.btn-small{

.stat{

}

.stat span{

}

.stat strong{

  font-size:28px;
  color:var(--bleu);
  margin-top:5px;
}

.filters{

  font-size:15px;
  background:white;
}

input:focus,
select:focus{
  outline:none;
  border-color:var(--bleu);
}

.table-card{
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
  overflow:hidden;
}

.table-wrapper{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1450px;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:middle;
}

th{
  background:#f1f3f7;
  color:var(--bleu);
  white-space:nowrap;
}

tr:hover td{

}

.photo-mini{

  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--or);
  background:#eee;
}

.initiales{
  width:45px;
  height:45px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bleu);
  color:white;
  font-weight:bold;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  background:#e8eefc;
  color:var(--bleu);
}

.empty{
  text-align:center;
  padding:35px;
  color:var(--gris);
}

}

.modal-box{

  padding:22px;
  position:relative;

.modal-box h3{

  color:var(--bleu);
}

.close{

  color:#555;
}

.form-grid{

}

.form-group{
  margin-bottom:10px;
}

.form-group label{
  display:block;
  font-weight:bold;
  font-size:13px;
  margin-bottom:5px;
}

.full{
  grid-column:1/-1;
}

.photo-preview{
  width:120px;
  height:120px;
