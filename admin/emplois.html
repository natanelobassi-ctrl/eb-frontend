<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emplois du temps — Groupe Scolaire Étoile Brillante</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fa;
  color:#1f2937;
}
header{
  background:#0A2A78;
  color:white;
  padding:22px 18px;
}
header h1{margin:0 0 6px;font-size:25px}
header p{margin:0;opacity:.9}

.container{
  max-width:1250px;
  margin:20px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#0A2A78;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

label{
  font-weight:bold;
  font-size:14px;
  display:block;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccd3df;
  border-radius:8px;
  font-size:14px;
  background:white;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary{background:#0A2A78;color:white}
.btn-gold{background:#C9A227;color:white}
.btn-danger{background:#c62828;color:white}
.btn-secondary{background:#6b7280;color:white}
.btn-green{background:#188038;color:white}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,td{
  padding:11px;
  border:1px solid #ddd;
  text-align:left;
  vertical-align:middle;
}

th{
  background:#0A2A78;
  color:white;
}

tr:nth-child(even){background:#f8fafc}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e8eefc;
  color:#0A2A78;
  font-size:12px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px;
  color:#6b7280;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat strong{
  display:block;
  font-size:25px;
  color:#0A2A78;
}

@media(max-width:900px){
  .form-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  header h1{font-size:21px}
  .actions button{width:100%}
  .stats{grid-template-columns:1fr}
}

@media print{
  header,
  .no-print,
  .form-card,
  .stats,
  .actions,
  .actions-cell{
    display:none!important;
  }

  body{background:white}

  .card{
    box-shadow:none;
    border:0;
  }

  table{
    min-width:0;
  }

  th{
    background:#ddd!important;
    color:black!important;
  }
}
</style>
</head>

<body>

<header>
  <h1>📅 Emplois du temps</h1>
  <p>Groupe Scolaire Étoile Brillante — Administration</p>
</header>

<div class="container">

  <!-- STATISTIQUES -->
  <div class="stats no-print">
    <div class="stat">
      <span>Total des cours</span>
      <strong id="totalCours">0</strong>
    </div>

    <div class="stat">
      <span>Classes concernées</span>
      <strong id="totalClasses">0</strong>
    </div>

    <div class="stat">
      <span>Enseignants concernés</span>
      <strong id="totalEnseignants">0</strong>
    </div>
  </div>

  <!-- FORMULAIRE -->
  <div class="card form-card">

    <h2 id="formTitle">➕ Ajouter un cours</h2>

    <div class="form-grid">

      <div>
        <label for="classe">Classe *</label>
        <select id="classe">
          <option value="">Sélectionner</option>
          <option>P1</option>
          <option>P2</option>
          <option>P3</option>

          <option>CP1</option>
          <option>CP2</option>
          <option>CE1</option>
          <option>CE2</option>
          <option>CM1</option>
          <option>CM2</option>

          <option>6e</option>
          <option>5e</option>
          <option>4e</option>
          <option>3e</option>

          <option>Seconde</option>
          <option>STC</option>
          <option>Première A</option>
          <option>Première D</option>
          <option>Terminale A</option>
          <option>Terminale D</option>
        </select>
      </div>

      <div>
        <label for="jour">Jour *</label>
        <select id="jour">
          <option value="">Sélectionner</option>
          <option>Lundi</option>
          <option>Mardi</option>
          <option>Mercredi</option>
          <option>Jeudi</option>
          <option>Vendredi</option>
          <option>Samedi</option>
        </select>
      </div>

      <div>
        <label for="heureDebut">Heure de début *</label>
        <input type="time" id="heureDebut">
      </div>

      <div>
        <label for="heureFin">Heure de fin *</label>
        <input type="time" id="heureFin">
      </div>

      <div>
        <label for="matiere">Matière *</label>
        <input type="text" id="matiere" placeholder="Ex. Mathématiques">
      </div>

      <div>
        <label for="enseignant">Enseignant *</label>
        <input type="text" id="enseignant" placeholder="Nom et prénom">
      </div>

      <div>
        <label for="salle">Salle</label>
        <input type="text" id="salle" placeholder="Ex. Salle 3">
      </div>

      <div>
        <label for="typeCours">Type</label>
        <select id="typeCours">
          <option>Cours</option>
          <option>TD</option>
          <option>TP</option>
          <option>Évaluation</option>
          <option>Activité</option>
          <option>Autre</option>
        </select>
      </div>

    </div>

    <div class="actions">
      <button class="btn-primary" onclick="enregistrerCours()">
        💾 Enregistrer
      </button>

      <button class="btn-secondary" onclick="annulerModification()">
        ↩ Réinitialiser
      </button>
    </div>

  </div>

  <!-- RECHERCHE -->
  <div class="card no-print">

    <h2>🔎 Rechercher un emploi du temps</h2>

    <div class="form-grid">

      <div>
        <label>Classe</label>
        <select id="filtreClasse" onchange="afficherCours()">
          <option value="">Toutes les classes</option>
          <option>P1</option>
          <option>P2</option>
          <option>P3</option>
          <option>CP1</option>
          <option>CP2</option>
          <option>CE1</option>
          <option>CE2</option>
          <option>CM1</option>
          <option>CM2</option>
          <option>6e</option>
          <option>5e</option>
          <option>4e</option>
          <option>3e</option>
          <option>Seconde</option>
          <option>STC</option>
          <option>Première A</option>
          <option>Première D</option>
          <option>Terminale A</option>
          <option>Terminale D</option>
        </select>
      </div>

      <div>
        <label>Jour</label>
        <select id="filtreJour" onchange="afficherCours()">
          <option value="">Tous les jours</option>
          <option>Lundi</option>
          <option>Mardi</option>
          <option>Mercredi</option>
          <option>Jeudi</option>
          <option>Vendredi</option>
          <option>Samedi</option>
        </select>
      </div>

      <div>
        <label>Recherche libre</label>
        <input
          type="text"
          id="recherche"
          placeholder="Matière, enseignant, salle..."
          oninput="afficherCours()">
      </div>

    </div>

    <div class="actions">
      <button class="btn-gold" onclick="imprimerEmploi()">
        🖨️ Imprimer
      </button>

      <button class="btn-secondary" onclick="exporterCSV()">
        📥 Exporter CSV
      </button>

      <button class="btn-danger" onclick="supprimerTout()">
        🗑️ Tout supprimer
      </button>
    </div>

  </div>

  <!-- TABLEAU -->
  <div class="card">

    <h2>📋 Liste des cours</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Jour</th>
            <th>Horaire</th>
            <th>Classe</th>
            <th>Matière</th>
            <th>Enseignant</th>
            <th>Salle</th>
            <th>Type</th>
            <th class="actions-cell no-print">Actions</th>
          </tr>
        </thead>

        <tbody id="tableCours"></tbody>

      </table>

    </div>

  </div>

</div>

<script>

const CLE = "EB_EMPLOIS";

let cours = [];
let indexModification = -1;

/* =========================
   CHARGEMENT
========================= */

function chargerCours(){

  try{
    cours = JSON.parse(localStorage.getItem(CLE)) || [];
  }catch(e){
    cours = [];
  }

  afficherCours();
}


/* =========================
   SAUVEGARDE
========================= */

function sauvegarder(){

  localStorage.setItem(
    CLE,
    JSON.stringify(cours)
  );

}


/* =========================
   ENREGISTRER
========================= */

function enregistrerCours(){

  const classe =
    document.getElementById("classe").value.trim();

  const jour =
    document.getElementById("jour").value.trim();

  const heureDebut =
    document.getElementById("heureDebut").value;

  const heureFin =
    document.getElementById("heureFin").value;

  const matiere =
    document.getElementById("matiere").value.trim();

  const enseignant =
    document.getElementById("enseignant").value.trim();

  const salle =
    document.getElementById("salle").value.trim();

  const type =
    document.getElementById("typeCours").value;

  if(
    !classe ||
    !jour ||
    !heureDebut ||
    !heureFin ||
    !matiere ||
    !enseignant
  ){

    alert(
      "Veuillez remplir tous les champs obligatoires."
    );

    return;
  }

  if(heureFin <= heureDebut){

    alert(
      "L'heure de fin doit être supérieure à l'heure de début."
    );

    return;
  }

  const nouveauCours = {

    id:
      indexModification >= 0
      ? cours[indexModification].id
      : Date.now(),

    classe,
    jour,
    heureDebut,
    heureFin,
    matiere,
    enseignant,
    salle,
    type

  };

  if(indexModification >= 0){

    cours[indexModification] =
      nouveauCours;

    alert("Cours modifié avec succès.");

  }else{

    cours.push(nouveauCours);

    alert("Cours enregistré avec succès.");

  }

  sauvegarder();

  annulerModification();

  afficherCours();

}


/* =========================
   AFFICHAGE
========================= */

function afficherCours(){

  const tbody =
    document.getElementById("tableCours");

  const filtreClasse =
    document.getElementById("filtreClasse").value;

  const filtreJour =
    document.getElementById("filtreJour").value;

  const recherche =
    document
      .getElementById("recherche")
      .value
      .toLowerCase()
      .trim();

  let liste = [...cours];

  if(filtreClasse){

    liste =
      liste.filter(
        c => c.classe === filtreClasse
      );

  }

  if(filtreJour){

    liste =
      liste.filter(
        c => c.jour === filtreJour
      );

  }

  if(recherche){

    liste =
      liste.filter(c => {

        const texte = (

          c.classe + " " +
          c.matiere + " " +
          c.enseignant + " " +
          c.salle + " " +
          c.type

        ).toLowerCase();

        return texte.includes(recherche);

      });

  }

  const ordreJours = {

    "Lundi":1,
    "Mardi":2,
    "Mercredi":3,
    "Jeudi":4,
    "Vendredi":5,
    "Samedi":6

  };

  liste.sort((a,b)=>{

    const j =
      (ordreJours[a.jour] || 99) -
      (ordreJours[b.jour] || 99);

    if(j !== 0) return j;

    return a.heureDebut.localeCompare(
      b.heureDebut
    );

  });

  tbody.innerHTML = "";

  if(liste.length === 0){

    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="empty">
          Aucun cours enregistré pour cette recherche.
        </td>
      </tr>
    `;

  }else{

    liste.forEach(c => {

      const index =
        cours.findIndex(
          x => x.id === c.id
        );

      const tr =
        document.createElement("tr");

      tr.innerHTML = `

        <td>
          <strong>${escapeHTML(c.jour)}</strong>
        </td>

        <td>
          ${escapeHTML(c.heureDebut)}
          —
          ${escapeHTML(c.heureFin)}
        </td>

        <td>
          <span class="badge">
            ${escapeHTML(c.classe)}
          </span>
        </td>

        <td>
          ${escapeHTML(c.matiere)}
        </td>

        <td>
          ${escapeHTML(c.enseignant)}
        </td>

        <td>
          ${escapeHTML(c.salle || "—")}
        </td>

        <td>
          ${escapeHTML(c.type || "Cours")}
        </td>

        <td class="actions-cell no-print">

          <button
            class="btn-gold"
            onclick="modifierCours(${index})">
            Modifier
          </button>

          <button
            class="btn-danger"
            onclick="supprimerCours(${index})">
            Supprimer
          </button>

        </td>

      `;

      tbody.appendChild(tr);

    });

  }

  mettreAJourStatistiques();

}


/* =========================
   MODIFIER
========================= */

function modifierCours(index){

  const c = cours[index];

  if(!c) return;

  document.getElementById("classe").value =
    c.classe;

  document.getElementById("jour").value =
    c.jour;

  document.getElementById("heureDebut").value =
    c.heureDebut;

  document.getElementById("heureFin").value =
    c.heureFin;

  document.getElementById("matiere").value =
    c.matiere;

  document.getElementById("enseignant").value =
    c.enseignant;

  document.getElementById("salle").value =
    c.salle || "";

  document.getElementById("typeCours").value =
    c.type || "Cours";

  indexModification = index;

  document.getElementById("formTitle").textContent =
    "✏️ Modifier le cours";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   SUPPRIMER
========================= */

function supprimerCours(index){

  if(!confirm(
    "Voulez-vous vraiment supprimer ce cours ?"
  )) return;

  cours.splice(index,1);

  sauvegarder();

  afficherCours();

}


/* =========================
   SUPPRIMER TOUT
========================= */

function supprimerTout(){

  if(cours.length === 0){

    alert("Aucun cours à supprimer.");

    return;

  }

  if(!confirm(
    "ATTENTION : voulez-vous supprimer tout l'emploi du temps ?"
  )) return;

  if(!confirm(
    "Cette action est définitive. Confirmer ?"
  )) return;

  cours = [];

  sauvegarder();

  afficherCours();

}


/* =========================
   RESET
========================= */

function annulerModification(){

  indexModification = -1;

  document.getElementById("formTitle").textContent =
    "➕ Ajouter un cours";

  document.getElementById("classe").value = "";

  document.getElementById("jour").value = "";

  document.getElementById("heureDebut").value = "";

  document.getElementById("heureFin").value = "";

  document.getElementById("matiere").value = "";

  document.getElementById("enseignant").value = "";

  document.getElementById("salle").value = "";

  document.getElementById("typeCours").value = "Cours";

}


/* =========================
   STATISTIQUES
========================= */

function mettreAJourStatistiques(){

  document.getElementById("totalCours").textContent =
    cours.length;

  const classes =
    new Set(
      cours.map(c => c.classe)
    );

  document.getElementById("totalClasses").textContent =
    classes.size;

  const enseignants =
    new Set(
      cours.map(c => c.enseignant)
    );

  document.getElementById("totalEnseignants").textContent =
    enseignants.size;

}


/* =========================
   IMPRESSION
========================= */

function imprimerEmploi(){

  window.print();

}


/* =========================
   EXPORT CSV
========================= */

function exporterCSV(){

  if(cours.length === 0){

    alert(
      "Aucun cours à exporter."
    );

    return;

  }

  let csv =
    "Jour;Début;Fin;Classe;Matière;Enseignant;Salle;Type\n";

  cours.forEach(c => {

    csv += [

      c.jour,
      c.heureDebut,
      c.heureFin,
      c.classe,
      c.matiere,
      c.enseignant,
      c.salle || "",
      c.type || ""

    ].map(v =>
      `"${String(v).replace(/"/g,'""')}"`
    ).join(";") + "\n";

  });

  const blob =
    new Blob(
      ["\ufeff" + csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "emploi-du-temps-etoile-brillante.csv";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


/* =========================
   SECURITE AFFICHAGE
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   DEMARRAGE
========================= */

chargerCours();

</script>

</body>
</html>
