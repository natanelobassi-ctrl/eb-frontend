<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saisie des notes - Groupe Scolaire Étoile Brillante</title>

<style>

:root{
    --bleu:#0A2A78;
    --bleu-clair:#123A9B;
    --or:#C9A227;
    --ivoire:#F7F4ED;
    --blanc:#FFFFFF;
    --texte:#1F2937;
    --vert:#198754;
    --rouge:#dc3545;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--ivoire);
    color:var(--texte);
    line-height:1.5;
}


/* =========================
   EN-TÊTE
========================= */

header{
    background:var(--bleu);
    color:white;
    padding:18px 4%;
    box-shadow:0 3px 12px rgba(0,0,0,.2);
}

header h1{
    font-size:1.4rem;
}

header p{
    margin-top:5px;
    opacity:.9;
}


/* =========================
   CONTENEUR
========================= */

.container{
    width:94%;
    max-width:1400px;
    margin:25px auto;
}


/* =========================
   CARTES
========================= */

.card{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.card h2{
    color:var(--bleu);
    margin-bottom:18px;
}


/* =========================
   INFORMATION
========================= */

.info{
    background:#fff8dc;
    border-left:5px solid var(--or);
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
}


/* =========================
   FILTRES
========================= */

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:1rem;
    background:white;
}


/* =========================
   TABLEAU
========================= */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1050px;
}

th{
    background:var(--bleu);
    color:white;
    padding:12px 8px;
    text-align:center;
    font-size:.9rem;
}

td{
    padding:9px 7px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

td:first-child{
    text-align:left;
    font-weight:bold;
}

input.note{
    width:85px;
    padding:9px;
    text-align:center;
    border:1px solid #bbb;
    border-radius:7px;
    font-size:1rem;
}

input.note:focus{
    outline:2px solid var(--or);
    border-color:var(--or);
}

.resultat{
    font-weight:bold;
    background:#f5f5f5;
}

.moyenne-classe{
    color:var(--bleu);
}

.moyenne-generale{
    color:var(--vert);
    font-size:1.05rem;
}

.coeff{
    font-weight:bold;
}


/* =========================
   BOUTONS
========================= */

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:22px;
}

button{
    border:none;
    border-radius:8px;
    padding:13px 20px;
    cursor:pointer;
    font-weight:bold;
    font-size:.95rem;
}

.btn-calculer{
    background:var(--bleu);
    color:white;
}

.btn-enregistrer{
    background:var(--vert);
    color:white;
}

.btn-reinitialiser{
    background:#777;
    color:white;
}

button:hover{
    opacity:.9;
    transform:translateY(-1px);
}


/* =========================
   RÉSULTATS
========================= */

.resume{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:20px;
}

.resume-box{
    padding:20px;
    border-radius:12px;
    background:#f4f4f4;
    text-align:center;
}

.resume-box strong{
    display:block;
    font-size:1.7rem;
    color:var(--bleu);
    margin-top:6px;
}

.decision{
    font-size:1.2rem;
    font-weight:bold;
}

.admis{
    color:var(--vert)!important;
}

.echoue{
    color:var(--rouge)!important;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .filters{
        grid-template-columns:1fr;
    }

    .resume{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:1.15rem;
    }

    .card{
        padding:16px;
    }

}

</style>
</head>


<body>


<!-- =========================
     EN-TÊTE
========================= -->

<header>

    <h1>
        Groupe Scolaire Étoile Brillante
    </h1>

    <p>
        Administration — Saisie et gestion des notes
    </p>

</header>



<div class="container">


<!-- =========================
     PARAMÈTRES
========================= -->

<div class="card">

    <h2>
        Paramètres de saisie
    </h2>


    <div class="info">
