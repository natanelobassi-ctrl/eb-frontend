<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notes — Groupe Scolaire Étoile Brillante</title>

<style>
:root{
  --bleu:#0A2A78;
  --bleu2:#123A9B;
  --or:#C9A227;
  --fond:#f3f5f9;
  --blanc:#fff;
  --texte:#1F2937;
  --vert:#15803d;
  --rouge:#b91c1c;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--fond);
  color:var(--texte);
}
header{
  background:linear-gradient(135deg,var(--bleu),var(--bleu2));
  color:white;
  padding:20px;
}
.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
header h1{margin:0;font-size:23px}
header p{margin:6px 0 0}
main{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}
.panel{
  background:white;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}
input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}
button,.btn{
  border:0;
  border-radius:7px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
}
.primary{background:var(--bleu);color:white}
.gold{background:var(--or);color:white}
.green{background:var(--vert);color:white}
.light{background:white;color:var(--bleu)}
.danger{background:var(--rouge);color:white}

.student{
  display:none;
  background:#eef3ff;
  border-left:5px solid var(--or);
  padding:15px;
  margin-top:15px;
  border-radius:8px;
}
.student strong{color:var(--bleu)}

.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  min-width:850px;
}
th,td{
  padding:9px;
  border:1px solid #ddd;
}
th{
  background:var(--bleu);
  color:white;
}
td input{
  min-width:90px;
}
.moyenne{
  background:#eef6ff;
  font-weight:bold;
}
.total{
  background:#fff8df;
  padding:15px;
  border-radius:8px;
  margin-top:20px;
}
.total strong{
  color:var(--bleu);
  font-size:20px;
}
.message{
  padding:12px;
  border-radius:7px;
  margin-top:10px;
  display:none;
}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div>
      <h1>📝 Gestion des notes</h1>
      <p>Groupe Scolaire Étoile Brillante</p>
    </div>
